name: CI

# Every branch, because that is where the work happens. Tags belong to the
# release workflow.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
    # Contract scripts parse SOURCE comments, never docs, so a code path
    # opens a run.
    paths-ignore:
      - "docs/**"
  pull_request:
  workflow_dispatch:

# Nothing here publishes anything; the release workflow holds the only token
# that writes.
permissions:
  contents: read

# Incremental artifacts and debug info bloat the caches; the dev profile
# keeps both out.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_DOWNLOAD_TIMEOUT: "600"

# Same-branch pushes cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Five independent lanes; the wall clock is the slowest, not the sum
# (docs/ci-architecture.md).
jobs:
  format:
    name: Rust / format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Rust / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          targets: wasm32-unknown-unknown
          cache-key: lint-cache

      # Names a stale lockfile first: --locked below rejects it.
      - name: Lockfile resolves without updates
        run: cargo metadata --format-version 1 --locked --no-deps > /dev/null

      # No allow-list: any workspace warning is red; the shell crate sits on
      # macOS.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --exclude mareader-shell --locked -- -D warnings

      # The only lane that compiles wasm32-only sites. Denies ride each
      # crate's own lints table.
      - name: Check the wasm frontend
        run: cargo check --target wasm32-unknown-unknown --workspace --locked --exclude mareader-shell

      # Feature unification hides under-declared deps; app-chrome is the
      # crate meant to be reused.
      - name: Check app-chrome standalone
        run: cargo check -p app-chrome --target wasm32-unknown-unknown --locked

      # A graph rule, not a grep rule: a transitively arriving engine escapes
      # grep.
      - name: Dependency gate
        run: node tools/check-dependency-gate.mjs

      # The host's direction inside one crate: it names no engine, format or
      # pane type.
      - name: Reader host boundary
        run: node tools/check-host-boundary.mjs

      # Session ownership: the engine is reached through a pane's own session.
      - name: Session ownership
        run: node tools/check-session-ownership.mjs

  test:
    name: Rust / test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-cache
      # --workspace, not a bare run: the root package would skip every
      # member crate.
      - name: Tests
        run: cargo test --workspace --exclude mareader-shell --locked

  web:
    name: Web / contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # One type-check + emission; the steps below consume what it builds.
      - name: Build TypeScript and the engine bundle
        run: npm run build:ts
      - name: Build CSS
        run: npm run build:css
      # Static: one canonical frontend build, no bare `trunk build`, devUrl
      # matching Trunk.
      - name: Tauri build contract
        run: node tools/check-tauri-contract.mjs
      # Behavioural: public/tauri-relay.js runs against a minimal DOM per
      # platform's frame shape.
      - name: Frame-side Tauri relay
        run: node tools/check-tauri-relay.mjs
      - name: Versions in sync
        run: node scripts/check-versions.js
      - name: Supported formats in sync
        run: node scripts/check-formats.js
      - name: Comment paths resolve
        run: node scripts/check-doc-paths.js
      - name: No dead-code suppressions
        run: |
          if grep -rn --include='*.rs' -E '#!?\[(allow|expect)\((dead_code|unused)' src crates src-tauri tests; then
            echo "::error::dead-code suppressions are not allowed — delete the code or use it"
            exit 1
          fi
      - name: Window-event tables agree
        run: node scripts/check-events.js
      - name: DOM contract agrees
        run: node scripts/check-dom-contract.js
      - name: Chrome contracts agree
        run: node scripts/check-chrome-contracts.js
      # Runs the bundle built above, not a stale artifact.
      - name: Engine smoke test
        run: node scripts/test-engine-smoke.js

  macos-shell:
    name: macOS / shell
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-key: macos-cache
      # generate_context! resolves frontendDist at compile time, so a stub
      # does.
      - name: Stub the frontend dist
        run: |
          mkdir -p dist
          printf '<!doctype html><title>Mareader</title>' > dist/index.html
      - name: Clippy (deny warnings)
        run: cargo clippy -p mareader-shell --all-targets --locked -- -D warnings
      # The AiChunk wire-contract tests live in this crate; without this
      # step they compile nowhere.
      - name: Tests (shell crate)
        run: cargo test -p mareader-shell --locked

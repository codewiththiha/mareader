name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Same-branch pushes cancel the previous run; release tags keep their runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (fmt, clippy, test, versions)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # No system packages are installed here on purpose: nothing in this job
      # compiles the `pdf` Tauri shell (clippy and tests exclude it, the wasm
      # check targets the pure-Rust frontend), so webkit2gtk & co. would be
      # dead weight. The shell is compiled natively by the macOS job below and
      # fully built by the release pipeline.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # node is only needed to run the version-sync check (pure stdlib, no
      # node_modules), so a frozen install is not required here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install the TypeScript dev dependencies (typescript + @types/node)
      # so the pre-build tsc step can compile the .ts sources the engine and
      # scripts are now written in.
      - name: Install Node dependencies
        run: npm ci

      # Type-check the TypeScript sources (public/pdfEngine.ts and
      # scripts/*.ts). The actual .js emission happens in the Trunk pre-build
      # hook and the `build:ts` npm script; this gate catches type errors
      # that the smoke test would otherwise only fail on at runtime.
      - name: Type-check TypeScript
        run: npm run check:ts

      # Emit the .js files the engine-smoke and version-sync steps below
      # expect (public/pdfEngine.js and scripts/*.js).
      - name: Build TypeScript
        run: npm run build:ts

      # NOTE: no `cargo fmt --check` here. The codebase is hand-formatted in a
      # style that rustfmt >=1.9x would rewrite across ~40 files; running it
      # would fail on pre-existing code. A one-time formatting pass can be a
      # dedicated commit if desired.
      #
      # Clippy is gated with `-D warnings`. The allow-list below is the complete
      # set of lints this workspace trips today — re-derived by running the step
      # with every `-A` removed, on the host and on the wasm frontend — and it
      # carries ESTABLISHED style rather than new sloppiness (e.g.
      # `clone_on_copy` for the idiomatic Leptos `state.clone()` on a `Copy`
      # AppState). It is deliberately short: a lint that stops firing should be
      # dropped from here, not left as a permanent exemption.
      # New code is still held to `-D warnings`.

      # `--workspace`, like the test step below: a bare `cargo clippy` selects
      # only the root package, which would silently leave pdf-core (the zoom
      # ladder and fit maths), pdf-engine, pdf-paper, and both virtual-list
      # crates out of the lint. `pdf` is excluded here and linted natively on
      # the macOS job, which is also where its tests run.
      - name: Clippy (deny warnings)
        run: |
          cargo clippy --workspace --all-targets --exclude pdf -- -D warnings \
            -A clippy::clone_on_copy \
            -A clippy::field_reassign_with_default \
            -A clippy::collapsible_if \
            -A clippy::redundant_closure \
            -A clippy::type_complexity \
            -A clippy::assertions_on_constants

      # --workspace, not a bare `cargo test`: the manifest root is also the
      # `pdf-reader` package, so a bare run tests only the app and silently
      # skips every member crate — pdf-core (the zoom ladder and fit maths),
      # virtual-list and virtual-list-leptos (the geometry kernel and its
      # anchor arithmetic). Those hold the invariants the reader depends on.
      #
      # `pdf` (the Tauri shell) is excluded: `tauri::generate_context!`
      # resolves `frontendDist` at compile time and panics when `../dist`
      # does not exist, and the frontend is only built by the release
      # pipeline. It has no unit tests of its own.
      - name: Tests
        run: cargo test --workspace --exclude pdf

      # The frontend is Rust compiled to wasm; verify it compiles for the wasm
      # target without a full `trunk build` (that lives in the release pipeline).
      - name: Check wasm frontend
        run: cargo check --target wasm32-unknown-unknown

      # The imperative engine (public/pdfEngine.ts) is browser code; run its
      # stub-based smoke test (compiled to scripts/test-engine-smoke.js by
      # the TypeScript build step above) to catch regressions in open /
      # render / theme-bake / scrub / destroy.
      - name: Engine smoke test
        run: node scripts/test-engine-smoke.js

      - name: Verify versions are in sync
        run: node scripts/check-versions.js

  # The Linux job above cannot see `set_traffic_lights`: it is
  # `#[cfg(target_os = "macos")]`, so a type error in it (or in the objc2
  # feature set that feeds it) would otherwise first surface when a release
  # tag builds the macOS legs. Check the shell crate natively on an Apple
  # runner to keep that gap closed.
  macos-check:
    name: Check (macOS-only shell code)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Keys on the workspace root, same as the Linux job.
      - uses: Swatinem/rust-cache@v2

      # `tauri::generate_context!` resolves `frontendDist` (../dist) at compile
      # time and panics when it is missing; the frontend itself is built by the
      # release pipeline, so a stub is enough to get past it here.
      - name: Stub the frontend dist
        run: |
          mkdir -p dist
          printf '<!doctype html><title>PDF Reader</title>' > dist/index.html

      - name: Clippy (deny warnings)
        run: |
          cargo clippy -p pdf --all-targets -- -D warnings \
            -A clippy::clone_on_copy \
            -A clippy::field_reassign_with_default \
            -A clippy::collapsible_if \
            -A clippy::redundant_closure \
            -A clippy::type_complexity \
            -A clippy::assertions_on_constants

      # The AiChunk wire-contract tests live in this crate; without this step
      # they compile nowhere and run nowhere.
      - name: Tests (shell crate)
        run: cargo test -p pdf

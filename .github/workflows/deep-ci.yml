name: Deep CI

# The expensive checks PR CI does not carry: the browser and native lanes.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      lanes:
        description: "Which lane to run"
        type: choice
        options: [both, browser, tauri]
        default: both
      ignore-skip:
        description: "Run even if the commit says [skip deep]"
        type: boolean
        default: false
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/deep-ci.yml"
      - "tests/browser/**"
      # The public tree: engine bundles, the shell's scripts, the Tauri relay.
      - "public/**"
      # An open/close, diagnostics, engine or virtualizer change moves what
      # the baseline measures.
      - "src/**"
      - "crates/reader-runtime/**"
      - "crates/library-runtime/**"
      # A wire or boundary change is a boot-path change; this lane boots one.
      - "crates/frame-transport/**"
      - "crates/runtime-contract/**"
      - "crates/pdf-engine/**"
      - "crates/pdf-paper/**"
      - "crates/app-state/**"
      - "crates/app-ui/**"
      - "crates/app-chrome/**"
      - "crates/tauri-bridge/**"
      - "crates/virtual-list/**"
      - "crates/virtual-list-leptos/**"
      # The boot path: the build contract, the shell page, the Tauri configs.
      - "index.html"
      - "reader.html"
      - "library.html"
      - "pdf.html"
      - "reflow.html"
      - "Trunk.toml"
      - "reader.Trunk.toml"
      - "library.Trunk.toml"
      - "pdf.Trunk.toml"
      - "reflow.Trunk.toml"
      - "package.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tsconfig.json"
      - "tsconfig.tools.json"
      - "tools/build-dist.sh"
      - "tools/runtime-artifacts.mjs"
      - "tools/release-freshness.mjs"
      - "tools/stage-merged.mjs"
      - "tools/dev.mjs"
      - "tools/tauri-smoke.mjs"
      - "tools/check-runtime-artifacts.mjs"
      - "tools/check-tauri-contract.mjs"
      - "src-tauri/**"
      - "styles/**"

permissions:
  contents: read

concurrency:
  group: deep-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_DOWNLOAD_TIMEOUT: "600"

jobs:
  # One job decides whether a push opted out: the SUBJECT, never the body.
  skip:
    name: Resolve the skip marker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.subject.outputs.skip }}
    steps:
      # Through the environment, never interpolated: a subject's quotes stay
      # data.
      - id: subject
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          case "$subject" in
            *"[skip deep]"*) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

  frontend-build:
    name: Production frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: skip
    if: >-
      needs.skip.outputs.skip != 'true'
      || github.event.inputs.ignore-skip == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: deep-cache

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/trunk
          trunk --version

      - name: Build the production frontend
        run: npm run build:dist

      # Both smoke lanes consume this same production build.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-dist
          path: dist
          retention-days: 3
          if-no-files-found: warn

  browser-lifecycle:
    name: Browser lifecycle baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [skip, frontend-build]
    # Two ways in: the subject's marker, or a dispatch narrowing the lane.
    if: >-
      github.event.inputs.lanes != 'tauri'
      && (needs.skip.outputs.skip != 'true'
      || github.event.inputs.ignore-skip == 'true')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Trunk pre-build hooks shell out to node_modules.
      - name: Install Node dependencies
        run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: dist

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser lifecycle baseline
        run: |
          node tests/browser/server.mjs &
          SERVER_PID=$!
          sleep 1
          BASE_URL=http://127.0.0.1:8123 node tests/browser/lifecycle.mjs
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

  # Split-read memory (tools/measure-split-return.mjs): PSS over the 70 s
  # after a four-pane close.
  memory-replay:
    name: Split memory replay
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: browser-lifecycle
    permissions:
      contents: read
      actions: read
    env:
      # Deep CI artifacts of the builds this one is compared against.
      BASELINES: "phase5-1e0dfc7:11021130605 phase6-90cb8f5:11029617681"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # WebKit is JavaScriptCore, the macOS app's engine, so retention is
      # checked there too.
      - name: Install Chromium and WebKit for Playwright
        run: npx playwright install --with-deps chromium webkit

      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: builds/current

      - name: Fetch the baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in $BASELINES; do
            name="${pair%%:*}"; id="${pair##*:}"
            if gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$name.zip" 2>/dev/null \
              && unzip -q "$name.zip" -d "builds/$name"; then
              echo "fetched $name"
            else
              echo "::notice::baseline $name ($id) is not available any more"
            fi
          done

      - name: Replay
        run: |
          # Without pipefail a run's failure is tee's success, and an engine
          # that never launched would pass as a quiet gap in the summary.
          set -o pipefail
          failed=0
          : > replay.log
          for engine in "" "--webkit"; do
            for dir in builds/*/; do
              name="$(basename "$dir")"
              for mode in "" "--intent"; do
                DIST_DIR="$dir" PORT=8124 node tests/browser/server.mjs > /dev/null &
                SERVER_PID=$!
                sleep 1
                echo "=== ${engine:-chromium} $name ${mode:-hands-off}" | tee -a replay.log
                node tools/measure-split-return.mjs "$name" http://127.0.0.1:8124 $mode $engine 2>&1 | tee -a replay.log \
                  || { echo "replay failed for $name $mode $engine" | tee -a replay.log; failed=$((failed + 1)); }
                kill $SERVER_PID 2>/dev/null || true
                wait $SERVER_PID 2>/dev/null || true
              done
            done
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed replay run(s) failed"
            exit 1
          fi

      # A closed split gives its memory back; the slope is the answer.
      # the answer (tools/measure-split-cycles.mjs).
      - name: Split close cycles
        if: always()
        run: |
          set -o pipefail
          failed=0
          : > cycles.log
          for engine in "" "--webkit --cycles 40"; do
            DIST_DIR=builds/current/ PORT=8124 node tests/browser/server.mjs > /dev/null &
            SERVER_PID=$!
            sleep 1
            echo "=== cycles ${engine:-chromium}" | tee -a cycles.log
            node tools/measure-split-cycles.mjs current http://127.0.0.1:8124 $engine 2>&1 | tee -a cycles.log \
              || { echo "cycles failed for ${engine:-chromium}" | tee -a cycles.log; failed=$((failed + 1)); }
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed cycle run(s) failed"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          node -e '
            const lines = require("fs").readFileSync("replay.log", "utf8").split("\n");
            const out = ["| engine | build | idle | library at rest | reading (4 panes) | +2 s | +20 s | +70 s | after GC / settle | frames at +20 s | frames at +70 s |", "|---|---|---|---|---|---|---|---|---|---|---|"];
            for (const l of lines.filter((l) => l.startsWith("RESULT "))) {
              const r = JSON.parse(l.slice(7));
              const at = (s) => r.afterReturn.find((x) => x.tag.startsWith(`+${s}s`));
              out.push(`| ${r.engine ?? "chromium"} | ${r.label} | ${r.intent ? "intent" : "hands off"} | ${r.libraryAtRest.pssMB} | ${r.reading.pssMB} | ${at(2).pssMB} | ${at(20).pssMB} | ${at(70).pssMB} | ${r.afterGc.pssMB} | ${at(20).frames.join(" ")} | ${at(70).frames.join(" ")} |`);
            }
            console.log(out.join("\n"));
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '

      - name: Cycles summary
        if: always()
        run: node tools/summarize-cycles.mjs cycles.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: memory-replay
          path: |
            replay.log
            cycles.log
          retention-days: 7

  # The packaged app, launched for real: the only blank-window gate.
  tauri-smoke:
    name: Tauri native boot smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [skip, frontend-build]
    if: >-
      github.event.inputs.lanes != 'browser'
      && (needs.skip.outputs.skip != 'true'
      || github.event.inputs.ignore-skip == 'true')
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: tauri-smoke-cache

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Linux needs WebKitGTK/GTK headers, xvfb, xwd and ImageMagick.
      - name: Install the Linux webview stack and X tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xvfb x11-apps imagemagick

      - name: Install Node dependencies
        run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: dist

      - name: Build the desktop shell
        run: cargo build --release -p mareader-shell --locked

      - name: Native boot smoke
        run: xvfb-run -a -s "-screen 0 1400x900x24" node tools/tauri-smoke.mjs

      - name: Upload the frontend on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: dist-tauri-smoke
          path: dist
          retention-days: 3

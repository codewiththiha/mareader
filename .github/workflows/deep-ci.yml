name: Deep CI

# The expensive checks the required PR workflow deliberately does not carry
# (docs/ci-architecture.md): the full production frontend build and the
# browser-level lifecycle baseline — the REAL wasm app in a REAL browser,
# driven through open / scroll / look-ahead / zoom / close-during-work /
# dispose / reopen, asserting the disposal baseline (docs/memory-baseline.md).
#
# Runs nightly, on demand, and when the things this lane exists to test are
# themselves changed (the engine bundles, the browser suite, this workflow).
#
# A push can opt out per commit: "[skip deep]" in the commit SUBJECT drops
# both lanes. These are the two most expensive jobs in the repo and the two
# that cannot run in under a minute, so a push that only moves a comment
# should not have to pay for them twice. The nightly schedule ignores the
# marker — whatever is skipped during the day is caught overnight.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      lanes:
        description: "Which lane to run"
        type: choice
        options: [both, browser, tauri]
        default: both
      ignore-skip:
        description: "Run even if the commit says [skip deep]"
        type: boolean
        default: false
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/deep-ci.yml"
      - "tests/browser/**"
      # The whole public tree: the engine bundles (pdfEngine/readerEngine),
      # the shell's classic scripts (shellBoot.js) and the frame's Tauri
      # relay (tauri-relay.js) all live here — a relay change without a
      # Deep run means the native read-proof smoke never sees it.
      - "public/**"
      # The lifecycle under test is also owned on the Rust side: an open/
      # close, diagnostics, engine or virtualizer change can alter what the
      # browser baseline measures just as much as an engine-bundle change.
      # (These are the paths at the split's tip — the pre-split
      # src/components, src/features, src/zoom and src/memory.rs entries that
      # used to be listed here moved into the crates below.)
      - "src/**"
      - "crates/reader-runtime/**"
      - "crates/library-runtime/**"
      - "crates/pdf-engine/**"
      - "crates/pdf-paper/**"
      - "crates/app-state/**"
      - "crates/app-ui/**"
      - "crates/app-chrome/**"
      - "crates/tauri-bridge/**"
      - "crates/virtual-list/**"
      - "crates/virtual-list-leptos/**"
      # The boot path itself: the one build contract, the shell page's boot
      # markup, and the two configs that decide how Tauri serves the frontend.
      - "index.html"
      - "reader.html"
      - "library.html"
      - "Trunk.toml"
      - "reader.Trunk.toml"
      - "library.Trunk.toml"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.tools.json"
      - "tools/build-dist.sh"
      - "tools/dev.mjs"
      - "tools/tauri-smoke.mjs"
      - "tools/check-runtime-artifacts.mjs"
      - "tools/check-tauri-contract.mjs"
      - "src-tauri/**"
      - "styles/**"

permissions:
  contents: read

concurrency:
  group: deep-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_DOWNLOAD_TIMEOUT: "600"

jobs:
  # One tiny job decides whether this push opted out. It reads the SUBJECT
  # only: `contains()` sees the whole commit message, so a body that merely
  # QUOTES the marker in prose — this file's own comments do — would
  # otherwise drop the most expensive gate in the repo by accident.
  skip:
    name: Resolve the skip marker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.subject.outputs.skip }}
    steps:
      # The message arrives through the environment, never interpolated into
      # the script: a subject carrying quotes or a command substitution is
      # data here, not shell.
      - id: subject
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          case "$subject" in
            *"[skip deep]"*) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

  browser-lifecycle:
    name: Browser lifecycle baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: skip
    # Two ways in: the commit subject says "[skip deep]", or a dispatch
    # narrowed the run to the other lane. Neither can be the last word — the
    # nightly cron ignores both, and a dispatch can override the marker.
    if: >-
      github.event.inputs.lanes != 'tauri'
      && (needs.skip.outputs.skip != 'true'
      || github.event.inputs.ignore-skip == 'true')
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: deep-cache

      # The real production build: Trunk's own hooks (engine bundle, tools,
      # CSS) fire inside it, and the release WASM is what the test drives.
      # Pinned binary — a `cargo install trunk` would spend minutes compiling
      # a build tool every run.
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/trunk
          trunk --version

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Trunk pre-build hooks shell out to node_modules.
      - name: Install Node dependencies
        run: npm ci

      - name: Build the production frontend
        # All three artifacts: the shell page plus the two runtime pages the
        # shell loads (tools/build-dist.sh merges them into dist/).
        run: sh tools/build-dist.sh --release

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser lifecycle baseline
        run: |
          node tests/browser/server.mjs &
          SERVER_PID=$!
          sleep 1
          BASE_URL=http://127.0.0.1:8123 node tests/browser/lifecycle.mjs
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      # Every run, not only a failed one: the build a green run measured is
      # the one a local comparison (route-switch latency, memory after a
      # return) or a bisect wants to serve, and a passing run used to leave
      # nothing to download. Three days is the whole window such a
      # comparison needs.
      - name: Upload dist for local debugging
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 3

  # Memory after a split read, for this build and for pinned baselines, on
  # one runner (tools/measure-split-return.mjs): renderer PSS and the frames
  # in the host over the 70 s after a four-pane book is closed, hands off
  # and with the pointer over the shelf. Evidence, not a gate: the lifecycle
  # suite asserts the disposal rule; this records what it costs. A baseline
  # whose artifact has expired is skipped.
  memory-replay:
    name: Split memory replay
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: browser-lifecycle
    permissions:
      contents: read
      actions: read
    env:
      # Deep CI artifacts of the builds this one is compared against.
      BASELINES: "phase5-1e0dfc7:11021130605 phase6-90cb8f5:11029617681"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: builds/current

      - name: Fetch the baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in $BASELINES; do
            name="${pair%%:*}"; id="${pair##*:}"
            if gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$name.zip" 2>/dev/null \
              && unzip -q "$name.zip" -d "builds/$name"; then
              echo "fetched $name"
            else
              echo "::notice::baseline $name ($id) is not available any more"
            fi
          done

      - name: Replay
        run: |
          : > replay.log
          for dir in builds/*/; do
            name="$(basename "$dir")"
            for mode in "" "--intent"; do
              DIST_DIR="$dir" PORT=8124 node tests/browser/server.mjs > /dev/null &
              SERVER_PID=$!
              sleep 1
              echo "=== $name ${mode:-hands-off}" | tee -a replay.log
              node tools/measure-split-return.mjs "$name" http://127.0.0.1:8124 $mode 2>&1 | tee -a replay.log \
                || echo "replay failed for $name $mode" | tee -a replay.log
              kill $SERVER_PID 2>/dev/null || true
              wait $SERVER_PID 2>/dev/null || true
            done
          done

      - name: Summary
        if: always()
        run: |
          node -e '
            const lines = require("fs").readFileSync("replay.log", "utf8").split("\n");
            const out = ["| build | idle | library at rest | reading (4 panes) | +2 s | +20 s | +70 s | after GC | frames at +70 s |", "|---|---|---|---|---|---|---|---|---|"];
            for (const l of lines.filter((l) => l.startsWith("RESULT "))) {
              const r = JSON.parse(l.slice(7));
              const at = (s) => r.afterReturn.find((x) => x.tag.startsWith(`+${s}s`));
              out.push(`| ${r.label} | ${r.intent ? "intent" : "hands off"} | ${r.libraryAtRest.pssMB} | ${r.reading.pssMB} | ${at(2).pssMB} | ${at(20).pssMB} | ${at(70).pssMB} | ${r.afterGc.pssMB} | ${at(70).frames.join(" ")} |`);
            }
            console.log(out.join("\n"));
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: memory-replay
          path: replay.log
          retention-days: 7

  # The packaged app, launched for real (§14). Every other job here builds or
  # serves the frontend; this one asks the native window whether a runtime
  # actually came up, which is the question the blank-window incident turned
  # on. It is the only gate that can fail on "the app opened and showed
  # nothing".
  tauri-smoke:
    name: Tauri native boot smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: skip
    if: >-
      github.event.inputs.lanes != 'browser'
      && (needs.skip.outputs.skip != 'true'
      || github.event.inputs.ignore-skip == 'true')
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          # The canonical frontend build compiles Rust TO WASM, so this job
          # needs the same target the browser job installs (without it trunk
          # dies in `can't find crate for `core``).
          targets: wasm32-unknown-unknown
          cache-key: tauri-smoke-cache

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The tauri crate's Linux build needs the WebKitGTK/GTK headers; the
      # smoke needs an X server (xvfb), xwd to read the framebuffer and
      # ImageMagick to summarise it.
      - name: Install the Linux webview stack and X tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xvfb x11-apps imagemagick

      - name: Install Node dependencies
        run: npm ci

      # The canonical build runs Trunk (plus its pre-build hooks), so the
      # builder the browser job pins is pinned identically here.
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/trunk
          trunk --version

      # The SAME canonical build Tauri runs (package.json's build:dist ->
      # tools/build-dist.sh), so this job cannot pass on a frontend the
      # packaged app would not have.
      - name: Build the production frontend
        run: npm run build:dist

      - name: Build the desktop shell
        run: cargo build --release -p mareader-shell --locked

      - name: Native boot smoke
        run: xvfb-run -a -s "-screen 0 1400x900x24" node tools/tauri-smoke.mjs

      - name: Upload the frontend on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: dist-tauri-smoke
          path: dist
          retention-days: 3

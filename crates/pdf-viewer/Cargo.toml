[package]
name = "pdf-viewer"
version = "0.5.0"
edition = "2024"
description = "Reusable Leptos PDF viewer: page canvases, continuous/single views, thumbnails, outline, search overlay, atoms. No app chrome, no Tauri references."
license = "MIT"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlDivElement",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlButtonElement",
  "Node",
  "NodeList",
  "Text",
  "DomTokenList",
  "CssStyleDeclaration",
  "CanvasRenderingContext2d",
  "Storage",
  "Event",
  "MouseEvent",
  "KeyboardEvent",
  "FocusEvent",
  "FocusOptions",
  "WheelEvent",
  "InputEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "DomRect",
  "DragEvent",
  "DataTransfer",
  "ScrollToOptions",
  "ScrollBehavior",
  "MediaQueryList",
  "CustomEvent",
] }
pdf-core = { path = "../pdf-core" }
pdf-engine = { path = "../pdf-engine" }
virtual-list = { path = "../virtual-list" }

[package]
name = "tauri-bridge"
version = "0.1.0"
edition = "2024"
description = "The raw window.__TAURI__ externs (IPC invoke, event listen, window handle, dialog open) plus the has_tauri probe, declared once and shared by every frontend crate that talks to the Tauri backend."
license = "MIT"

[dependencies]
# The macro emits wasm_bindgen_futures paths, so this crate must link it.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

[lints.rust]
# Warnings are denied, not printed: a gate only in the log gets read past.
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

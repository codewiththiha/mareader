[package]
name = "tauri-bridge"
version = "0.1.0"
edition = "2024"
description = "The raw window.__TAURI__ externs (IPC invoke, event listen, window handle, dialog open) plus the has_tauri probe, declared once and shared by every frontend crate that talks to the Tauri backend."
license = "MIT"

[dependencies]
# The `#[wasm_bindgen]` macro emits `wasm_bindgen_futures` paths in the shims
# it generates for async externs, so the crate that declares them must link
# it (same reason every other bridge crate here carries both).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

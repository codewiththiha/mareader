[package]
name = "library-runtime"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "library"
path = "src/bin/library.rs"

[dependencies]
app-chrome = { path = "../app-chrome" }
app-state = { path = "../app-state" }
app-ui = { path = "../app-ui" }
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
library-core = { path = "../library-core" }
pdf-engine = { path = "../pdf-engine" }
reader-core = { path = "../reader-core" }
runtime-contract = { path = "../runtime-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
storage = { path = "../storage" }
tauri-bridge = { path = "../tauri-bridge" }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlDivElement",
  "HtmlInputElement", "HtmlButtonElement", "HtmlSelectElement", "Node",
  "NodeList", "HtmlCollection", "DomTokenList", "CssStyleDeclaration",
  "Event", "MouseEvent", "KeyboardEvent", "WheelEvent", "DragEvent",
  "DataTransfer", "DomRect", "ResizeObserver", "ResizeObserverEntry",
  "Location", "UrlSearchParams", "Storage", "CustomEvent",
  "AddEventListenerOptions", "EventTarget", "Navigator", "Performance",
  "PerformanceEntry", "console", "ScrollIntoViewOptions", "ScrollLogicalPosition", "VisibilityState", "MessageEvent", "Worker",
] }

[dev-dependencies]
# The import service's tests read gloss marks straight off ai-core's types.
ai-core = { path = "../ai-core" }

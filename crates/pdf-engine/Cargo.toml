[package]
name = "pdf-engine"
version = "0.5.0"
edition = "2024"
description = "WASM bridge to the pdf.js engine (window.PDFReader): wasm-bindgen externs, typed wrappers, and the wire types that mirror pdfEngine.js return shapes."
license = "MIT"

[dependencies]
# Bounded-concurrency plumbing for the search index builder (already in the
# wasm graph via leptos, so it adds no new compilation unit to the app).
futures = "0.3"
tauri-bridge = { path = "../tauri-bridge" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
pdf-core = { path = "../pdf-core" }
pdf-paper = { path = "../pdf-paper" }

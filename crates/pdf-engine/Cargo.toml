[package]
name = "pdf-engine"
version = "0.5.0"
edition = "2024"
description = "WASM bridge to the pdf.js engine (window.PDFReader): wasm-bindgen externs, typed wrappers, and the wire types that mirror pdfEngine.js return shapes."
license = "MIT"

[dependencies]
# Bounded-concurrency plumbing for the search index builder.
futures = "0.3"
tauri-bridge = { path = "../tauri-bridge" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
pdf-core = { path = "../pdf-core" }
reader-core = { path = "../reader-core" }
pdf-paper = { path = "../pdf-paper" }

[lints.rust]
# Warnings are denied, not printed: the group runs first.
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

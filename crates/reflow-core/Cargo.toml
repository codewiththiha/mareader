[package]
name = "reflow-core"
version = "0.1.0"
edition = "2024"
description = "The shared maths of laying reflowable blocks out: the block shape, the A4 page geometry and its book gutter, the greedy page cutter and its height estimate, the typography resolution into CSS, and the block substring search. No parsing of any one format, no wasm, no DOM, no leptos — unit-testable on the host."
license = "MIT"

[dependencies]
reader-core = { path = "../reader-core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
# Warnings are denied, not printed: a gate that only shows up in the log is a
# gate that gets read past. The priority applies the group first, so the
# individual levels below it remain deliberate overrides.
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

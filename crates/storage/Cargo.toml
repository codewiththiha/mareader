[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[dependencies]
ai-core = { path = "../ai-core" }
runtime-contract = { path = "../runtime-contract" }
library-core = { path = "../library-core" }
reader-core = { path = "../reader-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Not target-gated: `local()` names `web_sys::Storage` on every target.
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[dev-dependencies]
# The kept-row tests build their books with `library_core::testkit`.
library-core = { path = "../library-core", features = ["test-util"] }

[package]
name = "document-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Document formats and filename policy, independent of reader runtimes"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

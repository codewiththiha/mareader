[package]
name = "reader-core"
version = "0.1.0"
edition = "2024"
description = "The reader's format-agnostic domain: the format registry, the persisted settings and appearance models, the theme presets, the zoom ladder, the view-mode and spread maths, the search result model and the outline node. No wasm, no DOM, no leptos, no knowledge of any one format — unit-testable on the host."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The one workspace crate reader-core names, a pure types leaf: the persisted
# blend config references the paper model `pdf-paper` defines. It may not
# depend back on this crate, and no format crate — and no virtualizer crate —
# may be named here (a settings read must never pull a renderer into the
# reader-neutral graph).
pdf-paper = { path = "../pdf-paper" }

[dev-dependencies]
serde_json = "1"

[lints.rust]
# Warnings are denied, not printed: a gate that only shows up in the log is a
# gate that gets read past. The priority applies the group first, so the
# individual levels below it remain deliberate overrides.
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

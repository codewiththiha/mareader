[package]
name = "ui-common"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlDivElement",
  "Node",
  "DomTokenList",
  "CssStyleDeclaration",
  "Event",
  "MouseEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "DomRect",
] }
tauri-bridge = { path = "../tauri-bridge" }
app-chrome = { path = "../app-chrome" }
ui-geom = { path = "../ui-geom" }

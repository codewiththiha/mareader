[package]
name = "pdf-core"
version = "0.5.0"
edition = "2024"
description = "Pure PDF-reader domain logic: layout, zoom/fit math, appearance, presets, search, filenames, settings. No wasm, no DOM, no leptos — unit-testable on the host."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
virtual-list = { path = "../virtual-list" }

[dev-dependencies]

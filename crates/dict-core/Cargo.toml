[package]
name = "dict-core"
version = "0.1.0"
edition = "2024"
description = "Dictionary core: POS canon across sources, NLP matching ranks, entry ordering, bridge planning, fuzzy matching."

[dependencies]
serde = { version = "1", features = ["derive"] }

[lints.rust]
# Warnings are denied, not printed: a gate only in a log gets read past.
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"

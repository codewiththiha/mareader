[package]
name = "frame-transport"
version = "0.1.0"
edition = "2024"
description = "The Shell ⇄ runtime frame transport: MessagePort wire adoption, generation-stamped envelopes and the ShellApi-over-port implementation both runtime artifacts boot with when hosted in a frame. The vocabulary lives in runtime-contract; this crate is the wire."
license = "MIT"

[dependencies]
js-sys = "0.3"
library-core = { path = "../library-core" }
reader-core = { path = "../reader-core" }
runtime-contract = { path = "../runtime-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["MessageEvent", "MessagePort", "Window"] }

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

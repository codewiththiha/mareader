[package]
name = "virtual-list"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Windowing math for virtualized scrolling lists of variably-sized items: which items to mount, where to put them, and which one the reader is looking at."
documentation = "https://docs.rs/virtual-list"
readme = "README.md"
repository = "https://github.com/codewiththiha/pdf-reader"
license = "MIT"
keywords = ["virtualization", "windowing", "scrolling", "list", "ui"]
categories = ["gui", "algorithms", "no-std"]

[dependencies]

[features]
default = ["std"]
std = []
# FenwickStrip + ChunkedStrip. pdf-reader only uses Strip; keep the extra
# backends off the default compile to cut ~800 lines from the wasm graph.
advanced-trees = []

[[bench]]
name = "scaling_check"
harness = false
required-features = ["advanced-trees"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

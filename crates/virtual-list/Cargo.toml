[package]
name = "virtual-list"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Windowing math for virtualized scrolling lists of variably-sized items: which items to mount, where to put them, and which one the reader is looking at."
readme = "README.md"
repository = "https://github.com/codewiththiha/mareader"
license = "MIT"
publish = false
keywords = ["virtualization", "windowing", "scrolling", "list", "ui"]
categories = ["gui", "algorithms", "no-std"]

[dependencies]

[features]
default = ["std"]
std = []

[lints.rust]
# Warnings are denied, not printed: the group runs first.
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[package]
name = "app-state"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
reader-core = { path = "../reader-core" }
tauri-bridge = { path = "../tauri-bridge" }
# Not target-gated: host lanes compile it too, and the gate saved nothing.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Performance", "PerformanceEntry", "console"] }
js-sys = "0.3"

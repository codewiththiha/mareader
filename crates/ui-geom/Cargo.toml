[package]
name = "ui-geom"
version = "0.1.0"
edition = "2024"
description = "Pure geometry for the surfaces that float: placement and viewport clamping for anchored panels, and the damped spring those panels and the gloss card both ride. No DOM, no framework, no feature knowledge — unit-testable on the host."
license = "MIT"

[dependencies]

[lints.rust]
# Warnings are denied, not printed: a gate that only shows up in the log is a
# gate that gets read past. The priority applies the group first, so the
# individual levels below it remain deliberate overrides.
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

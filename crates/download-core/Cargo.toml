[package]
name = "download-core"
version = "0.2.0"
edition = "2024"
description = "Resumable background downloads: mirror fallback, range resume, cache, verification, pause and cancel by id, and progress a frontend can draw."
license = "MIT"
readme = "README.md"

# A leaf: no path dependency, no import of the host application.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "rustls-tls",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync", "fs", "io-util", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints.rust]
# Warnings are denied, not printed: a gate only in a log gets read past.
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"

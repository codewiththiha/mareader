[package]
name = "download-core"
version = "0.1.0"
edition = "2024"
description = "Resumable, pausable background downloads for any feature: progress snapshots, retries, pause and cancel by id."

[dependencies]
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "rustls-tls",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
# Warnings are denied, not printed: a gate only in a log gets read past.
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"

[package]
name = "app-chrome"
version = "0.1.0"
edition = "2024"
description = "Format-agnostic window chrome: the platform probe, the window commands, the caption cluster (Windows squares, GNOME circles), the macOS native traffic lights, the generic hover/pin titlebar shell, and the shared UI primitives those chrome surfaces render with."
license = "MIT"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# Only two workspace crates are named: reader-core (schema) and ui-geom.
reader-core = { path = "../reader-core" }
ui-geom = { path = "../ui-geom" }
tauri-bridge = { path = "../tauri-bridge" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  # `Window::location` for the reload command; declared here, not inherited.
  "Location",
  # `Window::history`: the reload parks the address on the root before it goes.
  "History",
  "Navigator",
  "Document",
  "Element",
  "KeyboardEvent",
  "Node",
  # Rect returns: DomRect and DomRectReadOnly, declared so a lone check passes.
  "DomRect",
  "DomRectReadOnly",
  # `range_rects`: the Range type and its rect list, declared here too.
  "Range",
  "DomRectList",
  "HtmlDivElement",
  "ResizeObserver",
  # `use_frame_active`: the frame watches its own <iframe> slot attribute.
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "ResizeObserverEntry",
  "Event",
  "console",
] }

[lints.rust]
# Warnings are denied, not printed: a gate only in the log gets read past.
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[package]
name = "app-chrome"
version = "0.1.0"
edition = "2024"
description = "Format-agnostic window chrome: the platform probe, the window commands, the caption cluster (Windows squares, GNOME circles), the macOS native traffic lights, the generic hover/pin titlebar shell, and the shared UI primitives those chrome surfaces render with."
license = "MIT"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# The only workspace crates this one names: the dialog's format list
# (`reader-core`, a pure-schema leaf) and the placement math the floating
# adapters wrap (`ui-geom`). No engine, no runtime — reusing the chrome
# crate drags nothing executable along.
reader-core = { path = "../reader-core" }
ui-geom = { path = "../ui-geom" }
tauri-bridge = { path = "../tauri-bridge" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  # `Window::location` for the reload command — the app's own restart. Same
  # rule as the rects below: declared here, not inherited from a sibling's
  # feature unification.
  "Location",
  # `Window::history` for the same command: the reload parks the address on
  # the root before it goes, so the boot does not mount a reader for a
  # document that is not there (see `reload_window`).
  "History",
  "Navigator",
  "Document",
  "Element",
  "KeyboardEvent",
  "Node",
  # Rect returns: `get_bounding_client_rect` (DomRect) and a resize entry's
  # `content_rect` (DomRectReadOnly). Undeclared, the crate still built
  # inside the workspace — a sibling turns them on and feature unification
  # hands them over — but `cargo check -p app-chrome` failed. CI now runs
  # that check on its own so the crate stays reusable in isolation.
  "DomRect",
  "DomRectReadOnly",
  # `range_rects` measures a Range: the type itself and the rect list it hands
  # back. Same rule as the two above — declared here, not inherited from a
  # sibling's feature unification.
  "Range",
  "DomRectList",
  "HtmlDivElement",
  "ResizeObserver",
  "ResizeObserverEntry",
  "Event",
  "console",
] }

[lints.rust]
# Warnings are denied, not printed: a gate that only shows up in the log is a
# gate that gets read past. The priority applies the group first, so the
# individual levels below it remain deliberate overrides.
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

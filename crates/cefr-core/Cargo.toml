[package]
name = "cefr-core"
version = "0.1.0"
edition = "2024"
description = "Format-agnostic core of the vocabulary highlighter: tokenizing, planning, the level cache."

[dependencies]
# The dataset's own band and contraction rules; feature-free, so wasm builds.
cefr = { git = "https://github.com/codewiththiha/cefr-rs.git", default-features = false }

[lints.rust]
# Warnings are denied, not printed: a gate only in a log gets read past.
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"

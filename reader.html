<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mareader — reader runtime</title>
    <!-- Before every other script: republish the parent frame's Tauri API on
         this window (sub-frames stopped receiving it in Tauri 2 — see the
         file's header). File IO in this frame goes through it. -->
    <script src="/tauri-relay.js"></script>
    <link rel="stylesheet" href="vendor/pdfjs/pdf_viewer.css" />
    <link data-trunk rel="css" href="styles.css" />
    <link data-trunk rel="copy-dir" href="public/vendor" />
    <link data-trunk rel="copy-file" href="public/tauri-relay.js" />
    <link data-trunk rel="copy-file" href="public/pdfEngine.js" />
    <link data-trunk rel="copy-file" href="public/readerEngine.js" />
    <link data-trunk rel="copy-file" href="public/bake.worker.js" />
    <!-- No pdf.js script tag: the engine imports it on the first PDF open
         (public/engine/loader.ts, `ensurePdfjs`), so a reader session that
         never opens a PDF never loads it. The stylesheet above stays: the
         text layer's per-span geometry is its rules. -->
    <script type="module" src="/readerEngine.js"></script>
    <script type="module" src="/pdfEngine.js"></script>
    <!-- The reader artifact: its own Trunk config (reader.Trunk.toml) builds
         this page; the bin is the reader runtime alone. -->
    <link data-trunk rel="rust" href="crates/reader-runtime" data-bin="reader" data-wasm-opt="z" data-cargo-features="engine" />
  </head>
  <body></body>
</html>

[build]
target = "./index.html"
# Unhashed names so every build resolves `styles.css` in the merged dist;
# tools/check-runtime-artifacts.mjs asserts the set.
filehash = false

[watch]
# comment-check: allow — two startup rules an edit here would break silently.
#
# Every path below MUST exist on disk when `trunk serve` starts: Trunk 0.21.x
# canonicalizes each entry at startup, and a missing path is a hard error
# (trunk-rs/trunk#256). So these are real paths and not globs, an entry matches
# its whole subtree, and `beforeDevCommand` runs `npm run build:ts` first —
# generated, gitignored `scripts/` would otherwise have nothing to canonicalize.
# (Trunk's main branch moved to globset patterns, where a bare directory no
# longer matches its children; if that release is adopted, `./scripts` becomes
# `./scripts/**`.)
#
# The watcher fires on mtime and not on content, so each pre_build emission
# touches a generated file and would retrigger the rebuild that wrote it.
# `./src-tauri` is a separate Cargo crate the frontend never consumes.
ignore = [
    "./src-tauri",
    "./styles.css",
    # Generated: `tools/*.ts` compiles into `scripts/*.js`, so one entry covers
    # every tool. Watching them rebuilds forever.
    "./scripts",
    # comment-check: allow — two hazards: the hook's output restarting the
    # build, and the sheet changing under a live app.
    # Compiled by the hook on every build, so watching the sources buys a second
    # rebuild per CSS edit — and that rebuild swaps `styles.css` under a running
    # app, where a sheet arriving after boot paints an offscreen element for a
    # frame. `npm run watch:css` iterates on CSS alone.
    "./styles",
    "./public/pdfEngine.js",
    "./public/readerEngine.js",
    "./public/bake.worker.js",
    "./public/coverBake.js",
    # comment-check: allow — the default watch path is the repo root, and six
    # build trees live directly under it.
    # Every cargo run and every build-dist.sh leg writes one of these; each
    # write queued a rebuild after the build that made it.
    "./target",
    "./dist-library",
    "./dist-reader",
    "./dist-pdf",
    "./dist-reflow",
    # comment-check: allow — npm's store and dev.mjs's freshness manifest move
    # without a source edit, and both sit under the default watch path; dev.mjs
    # forces the rebuilds that matter itself.
    "./node_modules",
    "./.dev-artifacts",
]

# Bundle the engine with esbuild (IIFE, no import graph) through `node`, not
# `npx`.
[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["./tools/bundle-engine.mjs"]

[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["./node_modules/typescript/bin/tsc", "-p", "tsconfig.tools.json"]

# comment-check: allow — the Windows spawn rule that broke this hook.
# Compile Tailwind v4 (CSS-first) through `node`, never `npx`: on Windows the
# npm shims are `.cmd` files that `Command::new()` cannot spawn (it resolves
# real executables), so the hook died with "program not found" on the release
# leg. `node` is a real executable everywhere and the CLI is `dist/index.mjs`.
[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["./node_modules/@tailwindcss/cli/dist/index.mjs", "-i", "styles/input.css", "-o", "styles.css", "--minify"]

# comment-check: allow — the staging contract and the fresh-clone skip.
# Stage the merged runtime artifacts INTO the tree Trunk is about to apply:
# `trunk serve` swaps dist/ wholesale, and the shell's staging tree carries the
# shell alone, so without this every apply drops reader/library until the next
# restore — a 404 on the file the shell imports. post_build runs before the
# staging directory is copied over dist/, with the path in $TRUNK_STAGING_DIR;
# the runtime legs use their own configs and never run this hook, and a missing
# source (fresh clone, shell leg builds first) is a skip, not an error.
[[hooks]]
stage = "post_build"
command = "node"
command_arguments = ["./tools/stage-merged.mjs"]

# comment-check: allow — why the absent table is deliberate, not unfinished.
# No `[tools]` table on purpose: `wasm_opt` pins the binaryen RELEASE Trunk
# downloads, so `wasm_opt = "z"` 404s on `binaryen-z-<platform>.tar.gz` before a
# bundle exists. The optimise level belongs on the rust link in `index.html`
# (`data-wasm-opt="z"`), which is where Trunk reads it on release builds; add a
# real version here only to pin binaryen for reproducibility.

[serve]
port = 1420
open = false

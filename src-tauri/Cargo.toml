[package]
name = "mareader-shell"
version = "0.1.2"
description = "A desktop PDF reader built for long-form reading."
authors = ["codewiththiha"]
edition = "2024"


[lib]
# The `_lib` suffix keeps the lib name unique from the bin on Windows.
name = "mareader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The library's domain: the fingerprint, thresholds and head hash both share.
library-core = { path = "../crates/library-core" }
# The AI half: which selections count as a word, and the invoke boundary gate.
ai-core = { path = "../crates/ai-core" }
# The vocabulary half: tokenizer rules, dataset rebuild, lookups.
cefr-core = { path = "../crates/cefr-core" }
cefr = { git = "https://github.com/codewiththiha/cefr-rs.git", default-features = false, features = [
  "parquet",
  "sqlite",
  "nlp",
] }
# The dataset's transport; reqwest and tokio's file half is its business.
download-core = { path = "../crates/download-core" }
# The dictionary's POS canon: shared by the wasm menu and the backend.
dict-core = { path = "../crates/dict-core" }
# Packs ship as parquet; the builder reads them into sqlite.
arrow = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "zstd"] }
dotenvy = "0.15"      # Loads the .env file (FM_BRIDGE_BIN) before Tauri boots
futures = "0.3"       # Handles fm-bridge's async streams
async-stream = "0.3"  # Wraps the AI output chunks into a stream
tokio = { version = "1", features = ["time"] } # Drives the mock provider's simulated delays

# macOS-only: hide/show the native traffic lights, via objc2-app-kit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6"

# Apple Intelligence lives in the Tauri backend; optional and target-gated.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
fm-bridge = { git = "https://github.com/codewiththiha/fm-bridge.git", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Activates the Apple Intelligence provider on Apple Silicon Macs.
ai = ["dep:fm-bridge"]

[lints.rust]
# Warnings are denied, not printed: a gate only in the log gets read past.
warnings = { level = "deny", priority = -1 }

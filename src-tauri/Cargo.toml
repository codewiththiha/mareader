[package]
name = "pdf"
version = "0.5.0"
description = "A desktop PDF reader built for long-form reading."
authors = ["codewiththiha"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"      # Loads the .env file (FM_BRIDGE_BIN) before Tauri boots
futures = "0.3"       # Handles fm-bridge's async streams
async-stream = "0.3"  # Wraps the AI output chunks into a stream
tokio = { version = "1", features = ["time"] } # Drives the mock provider's simulated delays

# macOS-only: hide/show the native traffic lights (titlebar-less overlay mode).
#
# `objc2-app-kit` is the maintained Objective-C binding; the `objc` 0.2 crate it
# replaces has been frozen since 2019. Its `sel_impl!` macro also expanded a
# `cfg(feature = "cargo-clippy")` into *this* crate, which is why the manifest
# used to carry an `unexpected_cfgs` exemption — objc2 has no such leak, so the
# lint runs clean again. Tauri already pulls objc2-app-kit in, so this adds
# nothing to the dependency graph.
#
# The feature set is exactly what `set_traffic_lights` reaches, mirroring how
# tauri itself declares it: NSView/NSWindow for the walk from the webview's view
# to its window, NSButton+NSControl because that is `standardWindowButton:`'s
# return type chain, NSResponder because NSView/NSButton are declared under it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
raw-window-handle = "0.6"

# Apple Intelligence lives in the Tauri backend (WASM cannot spawn the Swift
# helper process). Optional + target-gated so Windows, Linux and Intel Macs
# never compile it; enabling the `ai` feature is a no-op there.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
fm-bridge = { git = "https://github.com/codewiththiha/fm-bridge.git", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Activates the Apple Intelligence provider on Apple Silicon Macs.
ai = ["dep:fm-bridge"]

[package]
name = "pdf"
version = "0.5.0"
description = "A desktop PDF reader built for long-form reading."
authors = ["codewiththiha"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS-only: hide/show the native traffic lights (titlebar-less overlay mode).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"

# objc 0.2's sel_impl! macro expands `cfg(feature = "cargo-clippy")` into OUR
# crate, and rustc's check-cfg lints that feature value. Declare it expected so
# the lint stays on for everything else. (The `feature, values(..)` form is the
# only one rustc accepts now — `cfg(cargo-clippy)` and `cfg(feature = "..")`
# are both rejected as invalid --check-cfg arguments.)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

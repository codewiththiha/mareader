[package]
name = "mareader"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "reader_ui"
path = "src/lib.rs"

[features]
default = ["library", "pdf", "txt", "md"]
library = ["dep:library-core"]
pdf = []
txt = ["dep:txt-core"]
md = ["dep:leptos-md", "dep:md-core"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# What the app reaches for through web-sys: window/document/element access,
# the html::Div node refs, classList + inline style writes, drag-drop
# (DragEvent + DataTransfer), scroll anchoring, resize observation, the
# reveal CustomEvent, and the non-passive wheel listener the horizontal strip
# needs (AddEventListenerOptions). The navigator user-agent read behind the
# platform probe is crates/app-chrome/src/platform.rs, and that crate
# declares the features it needs on its own.
web-sys = { version = "0.3", features = [
  "Window",
  "Navigator",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlDivElement",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "HtmlSelectElement",
  "Node",
  "NodeList",
  "HtmlCollection",
  "DomTokenList",
  "CssStyleDeclaration",
  "CanvasRenderingContext2d",
  "Event",
  "MouseEvent",
  "KeyboardEvent",
  "FocusOptions",
  "WheelEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "DomRect",
  "DomRectList",
  "Selection",
  "Range",
  # The reflowable gloss anchor walks a block's text nodes to turn a character
  # range back into a DOM Range (and reads each node's `data` to count them).
  "Text",
  "PointerEvent",
  "EventTarget",
  "AddEventListenerOptions",
  "DragEvent",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "ScrollToOptions",
  "ScrollBehavior",
  # The library's reveal: taking the reader to a book means centering its card in
  # the scroller, and `scroll_into_view` with no options cannot say "centered" or
  # "smoothly".
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "Storage",
  "MediaQueryList",
  "CustomEvent",
  "CustomEventInit",
  "console",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1.7"
# Markdown rendering for the reflowable formats: parses each block and
# emits Leptos views directly (GFM on, raw HTML off, no theme classes —
# the reader's own stylesheet owns the look).
leptos-md = { version = "0.1", optional = true }
ai-core = { path = "crates/ai-core" }
virtual-list = { path = "crates/virtual-list" }
virtual-list-leptos = { path = "crates/virtual-list-leptos" }
pdf-engine = { path = "crates/pdf-engine" }
pdf-paper = { path = "crates/pdf-paper" }
tauri-bridge = { path = "crates/tauri-bridge" }
app-chrome = { path = "crates/app-chrome" }
# The geometry primitives. The motion spring rides `ui_geom::spring`'s
# integrator, so it clamps to that crate's frame ceiling rather than
# restating the number.
ui-geom = { path = "crates/ui-geom" }
# The format cores. `reader-core` is everything a reader needs that no format
# owns (the format list, the view modes, the settings, the colour pipeline);
# `pdf-core` is the PDF's geometry and text index; `reflow-core` is the shared
# maths of laying text out, with `txt-core` and `md-core` one parser each on
# top of it. Nothing here knows about the next format; adding one is a new
# crate that depends on `reflow-core`, plus one directory in
# `src/components/formats`.
reader-core = { path = "crates/reader-core" }
pdf-core = { path = "crates/pdf-core" }
reflow-core = { path = "crates/reflow-core" }
txt-core = { path = "crates/txt-core", optional = true }
md-core = { path = "crates/md-core", optional = true }
# The library's domain: the book and its fingerprint, shelves and watched
# folders, the scan predicate, the rescan ledger, the sort and the persisted
# blob. Shared with the Tauri shell, which does the IO and measures with the
# same fingerprint this crate defines.
library-core = { path = "crates/library-core", optional = true }

[dev-dependencies]
# The app's host tests build their books, rows and shelves with the domain
# crate's own fixtures rather than a tenth private copy of a fifteen-field
# literal; the feature is a dev-only gate and never reaches a release build.
library-core = { path = "crates/library-core", features = ["test-util"] }

[workspace]
members = [
  "crates/document-core",
  "apps/library-wasm",
  "apps/reader-pdf-wasm",
  "apps/reader-txt-wasm",
  "apps/reader-md-wasm",
  "src-tauri",
  "crates/ai-core",
  "crates/virtual-list",
  "crates/virtual-list-leptos",
  "crates/reader-core",
  "crates/ui-geom",
  "crates/pdf-core",
  "crates/pdf-engine",
  "crates/pdf-paper",
  "crates/tauri-bridge",
  "crates/app-chrome",
  "crates/reflow-core",
  "crates/txt-core",
  "crates/md-core",
  "crates/library-core",
]

[profile.release]
# Keep wasm small for a desktop app.
opt-level = "z"
lto = true
codegen-units = 1

# DEV BUILDS SHIP A REAL BINARY TOO.
#
# `cargo tauri dev` builds the frontend unoptimized, and an unoptimized wasm
# build of this app is 46MB against 713KB for a release build. That is not just
# download size: the module is parsed and kept resident, and it accounted for
# roughly half of the "400MB at idle" this profile exists to prevent. Debug
# assertions and overflow checks stay on -- this only turns on the optimiser
# and strips the debug tables that make the module enormous.
#
# Set `debug = 2` here temporarily if you need to step through Rust in the
# browser devtools.
[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

# Dependencies are not what you are debugging, and optimising them costs
# nothing after the first build.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Debugging profile: the default `dev` profile is optimized (opt-level 1,
# stripped) because an unoptimized wasm module was responsible for roughly
# half of the "400MB at idle" footprint this profile set exists to prevent.
# When you need real debug symbols + step-through, use this instead:
#   trunk build --profile dev-debug   /   cargo build --profile dev-debug
[profile.dev-debug]
inherits = "dev"
opt-level = 0
debug = 1
strip = "none"

# Keep the app memory-safe by construction; the workspace has no unsafe
# outside the tauri shell crate.
[lints.rust]
# Warnings are denied, not printed: a gate that only shows up in the log is a
# gate that gets read past. The priority applies the group first, so the
# individual levels below it remain deliberate overrides.
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"

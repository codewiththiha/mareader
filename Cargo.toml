[package]
name = "mareader"
version = "0.1.2"
edition = "2024"

# Keys and definitions: https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# comment-check: allow — which web-sys features the app needs, and why.
# web-sys: window/document/element access, html::Div refs, classList and
# style writes, drag-drop (DragEvent + DataTransfer), scroll anchoring,
# resize observation, the reveal CustomEvent and the non-passive wheel
# listener. The platform probe's user-agent read is app-chrome's own.
web-sys = { version = "0.3", features = [
  "Window",
  "Navigator",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlDivElement",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "HtmlSelectElement",
  "Node",
  "NodeList",
  "HtmlCollection",
  "DomTokenList",
  "CssStyleDeclaration",
  "CanvasRenderingContext2d",
  "Event",
  "MouseEvent",
  "KeyboardEvent",
  "FocusOptions",
  "WheelEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  # The hosted runtime is an iframe; the boundary traffic rides its
  # MessageChannel port.
  "HtmlIFrameElement",
  "MessageChannel",
  "MessageEvent",
  "MessagePort",
  "DomRect",
  "DomRectList",
  "Selection",
  "Range",
  # The gloss anchor turns a character range into a DOM Range by walking
  # text nodes.
  "Text",
  "PointerEvent",
  "EventTarget",
  "AddEventListenerOptions",
  "DragEvent",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "ScrollToOptions",
  "ScrollBehavior",
  # The reveal needs scroll_into_view's options: centering and smoothness.
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "Storage",
  "MediaQueryList",
  "CustomEvent",
  "CustomEventInit",
  "console",
  # The web test hook reads window.location.search; browser builds only.
  "Location",
  "History",
  "PopStateEvent",
  "UrlSearchParams",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1.7"
tauri-bridge = { path = "crates/tauri-bridge" }
app-chrome = { path = "crates/app-chrome" }
app-state = { path = "crates/app-state" }
runtime-contract = { path = "crates/runtime-contract" }
app-ui = { path = "crates/app-ui" }
storage = { path = "crates/storage" }
# comment-check: allow — the dependency gate's rule, in one place.
# The shell hosts runtimes and owns none of what they own: its only domain
# reads are reader-core's settings and runtime-contract, library-core arrives
# through storage, and an engine or paginator here is a regression.
reader-core = { path = "crates/reader-core" }

[workspace]
members = [
  "src-tauri",
  "crates/ai-core",
  "crates/app-state",
  "crates/runtime-contract",
  "crates/frame-transport",
  "crates/app-ui",
  "crates/storage",
  "crates/library-runtime",
  "crates/reader-runtime",
  "crates/virtual-list",
  "crates/virtual-list-leptos",
  "crates/reader-core",
  "crates/cefr-core",
  "crates/ui-geom",
  "crates/pdf-core",
  "crates/pdf-engine",
  "crates/pdf-paper",
  "crates/tauri-bridge",
  "crates/app-chrome",
  "crates/reflow-core",
  "crates/txt-core",
  "crates/md-core",
  "crates/library-core",
]

[profile.release]
# Keep wasm small for a desktop app.
opt-level = "z"
lto = true
codegen-units = 1

# Faster frontend release builds with local incremental recompilation.
[profile.wasm-release]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

# The iteration profile keeps route WASM responsive without release LTO.
[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"
incremental = true

# Dependencies are not what you debug, and optimising them is free after
# one build.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Use `--profile dev-debug` when symbols and Rust step-through debugging matter.
[profile.dev-debug]
inherits = "dev"
opt-level = 0
debug = 1
strip = "none"

# Memory-safe by construction: no unsafe outside the tauri shell crate.
[lints.rust]
# Warnings are denied, not printed: a gate only in a log gets read past.
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"

[package]
name = "pdf-ui"
version = "0.5.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Feature set kept broad so feature branches (viewer/continuous, viewer/chrome,
# panels/sidebar, panels/settings) and the redesign units (floating search,
# appearance/more menus, drag-drop) never need to edit Cargo.toml. DragEvent +
# DataTransfer are consumed by ReaderView drag-drop in phase 5.
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlDivElement",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "HtmlSelectElement",
  "HtmlOptionElement",
  "Node",
  "NodeList",
  "Text",
  "DomTokenList",
  "CssStyleDeclaration",
  "CanvasRenderingContext2d",
  "Storage",
  "Event",
  "MouseEvent",
  "KeyboardEvent",
  "FocusEvent",
  "FocusOptions",
  "WheelEvent",
  "InputEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "DomRect",
  "DragEvent",
  "DataTransfer",
  "ScrollToOptions",
  "ScrollBehavior",
  "MediaQueryList",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1.7"
virtual-list = { path = "crates/virtual-list" }

[workspace]
members = ["src-tauri", "crates/virtual-list"]

[profile.release]
# Keep wasm small for a desktop app.
opt-level = "z"
lto = true
codegen-units = 1

# DEV BUILDS SHIP A REAL BINARY TOO.
#
# `cargo tauri dev` builds the frontend unoptimized, and an unoptimized wasm
# build of this app is 46MB against 713KB for a release build. That is not just
# download size: the module is parsed and kept resident, and it accounted for
# roughly half of the "400MB at idle" this profile exists to prevent. Debug
# assertions and overflow checks stay on -- this only turns on the optimiser
# and strips the debug tables that make the module enormous.
#
# Set `debug = 2` here temporarily if you need to step through Rust in the
# browser devtools.
[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

# Dependencies are not what you are debugging, and optimising them costs
# nothing after the first build.
[profile.dev.package."*"]
opt-level = 2
debug = false

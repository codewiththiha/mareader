[package]
name = "mareader"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# What the SHELL reaches for through web-sys: window/document/element access,
# the html::Div node refs, classList + inline style writes, the library's
# drag-drop (DragEvent + DataTransfer) and its reveal, scroll anchoring, and
# the CustomEvent the window-event table dispatches. The reader's half of the
# DOM — canvases and their 2d contexts, text-node walks, range rects, the
# selection, the non-passive wheel listener, resize observation — is declared
# by `crates/reader-app`, and the chrome's half (the platform probe, the
# memory probe, the titlebar rects) by `crates/app-chrome`: each crate names
# what it touches rather than inheriting it from a sibling's feature
# unification.
web-sys = { version = "0.3", features = [
  "Window",
  "Navigator",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlDivElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "HtmlSelectElement",
  "Node",
  "DomTokenList",
  "CssStyleDeclaration",
  "Event",
  "MouseEvent",
  "KeyboardEvent",
  "FocusOptions",
  "DomRect",
  "PointerEvent",
  "EventTarget",
  "DragEvent",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "ScrollToOptions",
  "ScrollBehavior",
  # The library's reveal: taking the reader to a book means centering its card in
  # the scroller, and `scroll_into_view` with no options cannot say "centered" or
  # "smoothly".
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  # localStorage: the persisted settings, the library blob, the covers and the
  # gloss marks all live here, and `src/storage` is the only door to them.
  "Storage",
  "CustomEvent",
  "CustomEventInit",
  "console",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1.7"
ai-core = { path = "crates/ai-core" }
pdf-engine = { path = "crates/pdf-engine" }
tauri-bridge = { path = "crates/tauri-bridge" }
app-chrome = { path = "crates/app-chrome" }
# The reader's format-agnostic domain — the format registry, the view modes,
# the persisted settings, the zoom ladder, the colour pipeline — which the
# shell reads for its menus and its settings rows as much as the reader does.
reader-core = { path = "crates/reader-core" }
# The reflowable parsers, because the OPEN flow is the shell's: it is what
# turns the bytes it read into the blocks it hands the reader. `reflow-core`
# is the shared maths of laying text out, with `txt-core` and `md-core` one
# parser each on top of it.
reflow-core = { path = "crates/reflow-core" }
txt-core = { path = "crates/txt-core" }
md-core = { path = "crates/md-core" }
# The reusable UI kit every surface renders with — the generic controls, the
# floating surfaces, the overlay lanes, the pointer gestures — and the
# `mareader:*` window-event table. It moved out of `components/primitives` so
# that the shell and the reader can each compile it without the other.
ui-kit = { path = "crates/ui-kit" }
# The document reader itself: an open document's state, its viewer and
# formats, the AI reading features, the search surfaces, the rail, the zoom
# pipeline and the effects that hold them together. The shell crate renders
# one route with it (`features/reader/page.rs`) and otherwise never reaches
# inside it. In the second phase this becomes the reader's own binary.
reader-app = { path = "crates/reader-app" }
# The library's domain: the book and its fingerprint, shelves and watched
# folders, the scan predicate, the rescan ledger, the sort and the persisted
# blob. Shared with the Tauri shell, which does the IO and measures with the
# same fingerprint this crate defines.
library-core = { path = "crates/library-core" }

[dev-dependencies]
# The app's host tests build their books, rows and shelves with the domain
# crate's own fixtures rather than a tenth private copy of a fifteen-field
# literal; the feature is a dev-only gate and never reaches a release build.
library-core = { path = "crates/library-core", features = ["test-util"] }

[workspace]
members = [
  "src-tauri",
  "crates/ai-core",
  "crates/virtual-list",
  "crates/virtual-list-leptos",
  "crates/reader-core",
  "crates/ui-geom",
  "crates/pdf-core",
  "crates/pdf-engine",
  "crates/pdf-paper",
  "crates/tauri-bridge",
  "crates/app-chrome",
  "crates/ui-kit",
  "crates/reflow-core",
  "crates/txt-core",
  "crates/md-core",
  "crates/library-core",
  "crates/reader-app",
]

[profile.release]
# Keep wasm small for a desktop app.
opt-level = "z"
lto = true
codegen-units = 1

# DEV BUILDS SHIP A REAL BINARY TOO.
#
# `cargo tauri dev` builds the frontend unoptimized, and an unoptimized wasm
# build of this app is 46MB against 713KB for a release build. That is not just
# download size: the module is parsed and kept resident, and it accounted for
# roughly half of the "400MB at idle" this profile exists to prevent. Debug
# assertions and overflow checks stay on -- this only turns on the optimiser
# and strips the debug tables that make the module enormous.
#
# Set `debug = 2` here temporarily if you need to step through Rust in the
# browser devtools.
[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

# Dependencies are not what you are debugging, and optimising them costs
# nothing after the first build.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Debugging profile: the default `dev` profile is optimized (opt-level 1,
# stripped) because an unoptimized wasm module was responsible for roughly
# half of the "400MB at idle" footprint this profile set exists to prevent.
# When you need real debug symbols + step-through, use this instead:
#   trunk build --profile dev-debug   /   cargo build --profile dev-debug
[profile.dev-debug]
inherits = "dev"
opt-level = 0
debug = 1
strip = "none"

# Keep the app memory-safe by construction; the workspace has no unsafe
# outside the tauri shell crate.
[lints.rust]
# Warnings are denied, not printed: a gate that only shows up in the log is a
# gate that gets read past. The priority applies the group first, so the
# individual levels below it remain deliberate overrides.
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"

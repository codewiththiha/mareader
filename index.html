<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Reader</title>
    <!-- pdf.js text-layer base rules (required for selectable text). Served from public/. -->
    <link rel="stylesheet" href="vendor/pdfjs/pdf_viewer.css" />
    <link data-trunk rel="css" href="styles.css" />
    <!-- Copy static assets to the dist ROOT so root-absolute URLs (/vendor/..., /pdfEngine.js)
         resolve in the packaged app. Trunk's copy-dir preserves the referenced dir's basename. -->
    <link data-trunk rel="copy-dir" href="public/vendor" />
    <link data-trunk rel="copy-dir" href="public/samples" />
    <link data-trunk rel="copy-file" href="public/pdfEngine.js" />
    <!-- pdf.js (ESM-only in v6): must load BEFORE the engine so globalThis.pdfjsLib exists. -->
    <script type="module" src="/vendor/pdfjs/pdf.min.mjs"></script>
    <!-- The imperative engine wrapper: sets window.PDFReader (see public/pdfEngine.js).
         MUST execute BEFORE the Leptos wasm (the rust link below). main() calls
         window.PDFReader.storageGet synchronously during mount — if the wasm module
         (which top-level-awaits init) ran first, it could finish instantiating before
         this script had executed, leaving window.PDFReader undefined and panicking the
         mount. Ordering these first removes the race. -->
    <script type="module" src="/pdfEngine.js"></script>
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>
  <body></body>
</html>

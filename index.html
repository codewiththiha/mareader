<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mareader</title>
    <link data-trunk rel="css" href="styles.css" />
    <!-- Copy static assets to the dist ROOT so root-absolute URLs (/vendor/..., /pdfEngine.js)
         resolve in the packaged app's runtime pages. Trunk's copy-dir preserves the referenced dir's basename. -->
    <link data-trunk rel="copy-dir" href="public/vendor" />
    <link data-trunk rel="copy-dir" href="public/samples" />
    <link data-trunk rel="copy-file" href="public/pdfEngine.js" />
    <link data-trunk rel="copy-file" href="public/readerEngine.js" />
    <!-- The theme bake worker (public/bake.worker.js, generated by the esbuild
         pre-build hook) must ship next to the engine in the packaged app; the
         engine falls back to inline baking when it cannot find it. -->
    <link data-trunk rel="copy-file" href="public/bake.worker.js" />
    <!-- The frames' Tauri facade: the runtime iframes load /tauri-relay.js
         from the dist root, so the shell page's build is what ships it —
         same rule as the engine bundles above (the artifact contract pins
         it). -->
    <link data-trunk rel="copy-file" href="public/tauri-relay.js" />
    <!-- The Shell's cover-bake page (src/app/bake.rs): pdf.js plus the
         engine's cover render, mounted hidden while the shelf has covers to
         bake and removed after. Shipped from here like the relay above; the
         shell page itself never loads it. -->
    <link data-trunk rel="copy-file" href="public/bake.html" />
    <link data-trunk rel="copy-file" href="public/coverBake.js" />
    <!-- No engine scripts: the shell page loads no pdf.js, no engine wrapper
         and no reader bundle. Documents run in the reader frame and shelf
         cover bakes in the bake page above, so the shell's own startup is
         its wasm and nothing else. The copy-file links above still ship
         those bundles to the dist root, where the runtime pages load them. -->
    <!-- A plain-data, weak-callback budget shared by all PDF pane realms.
         It contains no PDF engine and runs before the Shell can mount panes. -->
    <link data-trunk rel="copy-file" href="public/rasterLane.js" />
    <link data-trunk rel="copy-file" href="public/readerHost.js" />
    <script src="/rasterLane.js"></script>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <!-- The remembered paper, applied before the body exists (see the file):
         synchronous on purpose — a deferred script would run after the first
         paint it exists to colour. External for the CSP. -->
    <link data-trunk rel="copy-file" href="public/bootPaint.js" />
    <script src="/bootPaint.js"></script>
  </head>
  <body>
    <!-- The shell's boot placeholder (§5): it lives in the PAGE, never in a
         runtime, because the runtime is exactly what may fail to load. It is
         what the user sees while the shell wasm downloads, instantiates and
         loads its first runtime — the difference between "starting" and a
         blank window. It goes when the host's coverage watch finds a runtime
         painted (src/app/boot.rs), which is the one place that knows the
         difference — and the runtime host owns the area from then on.
         The id and the copy are a CONTRACT: tools/check-runtime-artifacts.mjs
         fails the build if either disappears from the built page. The mark is
         the app's own loading mark (the `.loader` class pair the Loader
         component uses, so the wait looks like one thing from boot to pane) and
         the words say which stage the wait is in: public/shellBoot.js walks
         them as time passes and reveals the failure copy when the shell never
         arrives. The screen wears the remembered paper (public/bootPaint.js),
         so on a dark theme nothing in the launch is white but the pixels the
         webview itself has not painted yet. -->
    <div id="shell-boot" class="shell-boot" role="status" aria-live="polite">
      <div class="loader shell-boot__loader" aria-hidden="true">
        <span class="loader-dot loader-dot-a"></span>
        <span class="loader-dot loader-dot-b"></span>
        <span class="loader-dot loader-dot-c"></span>
      </div>
      <p class="shell-boot__title">Loading MAReader…</p>
      <p class="shell-boot__hint">Starting the shell</p>
    </div>
    <!-- The "never waits forever" half of §3, and the voice of the two lines
         above: shellBoot.js walks the hint as the wait grows and makes its last
         stage the failure report — if the shell wasm has not taken over within
         20s (a failed download, a panic before the first mount) the placeholder
         says so instead of spinning silently. The healthy path
         removes the element long before the deadline (src/app/mod.rs).
         An external file, not an inline script: the packaged app's CSP
         (`script-src 'self'` in src-tauri/tauri.conf.json) blocks inline. -->
    <link data-trunk rel="copy-file" href="public/shellBoot.js" />
    <script src="/shellBoot.js" defer></script>
  </body>
</html>

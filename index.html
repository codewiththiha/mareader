<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mareader</title>
    <!-- pdf.js text-layer base rules (required for selectable text). Served from public/. -->
    <link rel="stylesheet" href="vendor/pdfjs/pdf_viewer.css" />
    <link data-trunk rel="css" href="styles.css" />
    <!-- Copy static assets to the dist ROOT so root-absolute URLs (/vendor/..., /pdfEngine.js)
         resolve in the packaged app. Trunk's copy-dir preserves the referenced dir's basename. -->
    <link data-trunk rel="copy-dir" href="public/vendor" />
    <link data-trunk rel="copy-dir" href="public/samples" />
    <link data-trunk rel="copy-file" href="public/pdfEngine.js" />
    <link data-trunk rel="copy-file" href="public/readerEngine.js" />
    <!-- The theme bake worker (public/bake.worker.js, generated by the esbuild
         pre-build hook) must ship next to the engine in the packaged app; the
         engine falls back to inline baking when it cannot find it. -->
    <link data-trunk rel="copy-file" href="public/bake.worker.js" />
    <!-- Session boot (public/sessionBoot.js, from public/session/boot.ts).
         A module script BEFORE the rust link: Trunk replaces that link with a
         module script in place, module scripts run in order, and this one
         top-level-awaits. A shelf boot loads the library module and does not
         resolve, so this host wasm never starts on the shelf. A reader boot
         returns after the reader engine, and this host wasm starts. pdf.js is
         not imported for either boot; a PDF format mount loads it. The engines
         stay copy-file'd so those dynamic imports resolve in the packaged app. -->
    <link data-trunk rel="copy-file" href="public/sessionBoot.js" />
    <script type="module" src="/sessionBoot.js"></script>
    <link data-trunk rel="rust" data-wasm-opt="z" data-bin="mareader" />
  </head>
  <body></body>
</html>
